<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comandas</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4aa935"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Comandas">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--lt:#9be03c;--bg:#9be03c;--ro:#2a3142;--ro2:#4a22c4;--cd:#fff;--tx:#2a3142;--mu:#5b5873;--ln:#e4e0f0;--or:#23222b;--ok:#9be03c;--gr:#23222b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,sans-serif}
h1,h2,.bree,.nm,.vl,.big b,.rec b,.bt,.tabs button,.chip{font-family:'Poppins',system-ui,sans-serif;font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ro);z-index:20}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--ro);color:#fff;display:flex;align-items:center;gap:4px;padding:10px 12px;min-height:60px;border-radius:0 0 22px 22px;box-shadow:0 6px 18px #2a314255}
header h1{flex:1;margin:0;font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:#ffffff1f;border:0;color:#fff;font-size:20px;width:42px;height:42px;border-radius:14px}
.ib:active{background:#fff4}
main{padding:14px 12px 100px;max-width:720px;margin:0 auto}
.box{background:var(--cd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px #2a314226}
.r{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.big{font-size:24px}
input,textarea{font:inherit;color:var(--gr);background:#fff;border:2px solid var(--ln);padding:10px 12px;min-width:0;width:100%;border-radius:14px}
input:focus,textarea:focus{outline:0;border-color:var(--ro)}
textarea{margin-top:12px;resize:vertical}
.sm{width:88px;text-align:right}
button{font:inherit;cursor:pointer}
.bt{background:var(--ro);color:#fff;border:0;border-radius:14px;padding:12px 16px}
.bt.ro{background:var(--ro)}
.bt.gh{background:#fff;color:var(--ro);border:2px solid var(--ro)}
.q{background:var(--ro);color:#fff;border:0;border-radius:12px;width:40px;height:40px;font-size:20px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:11px;border-radius:999px;border:0;background:#ffffffcc;color:var(--ro)}
.tabs .on{background:var(--ro);color:#fff}
.grid{display:grid;gap:12px}
.cm{background:var(--cd);border-radius:20px;padding:14px;min-height:124px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 4px 14px #2a314226;cursor:pointer}
.cm.f{opacity:.8}
.chip{align-self:flex-start;font-size:12px;background:var(--lt);color:var(--gr);border-radius:999px;padding:3px 10px}
.cm.f .chip{background:var(--ln);color:var(--mu)}
.cm .nm{font-size:19px;overflow-wrap:anywhere;color:var(--ro)}
.cm .vl{font-size:19px;color:var(--ro)}
.cm small{color:var(--mu)}
.rec{background:var(--ro);color:#fff;border-radius:20px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;box-shadow:0 6px 16px #2a314255}
.rec b{font-size:26px;color:var(--lt)}
.rec button{background:var(--lt);color:var(--gr);border:0;border-radius:999px;padding:9px 18px;font-weight:600}
.it{background:var(--cd);border-radius:20px;padding:10px;margin-bottom:10px;display:flex;gap:12px;box-shadow:0 4px 14px #2a314226}
.th{width:68px;height:68px;border-radius:14px;object-fit:cover;background:var(--ln);flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ro)}
.it .c{flex:1;min-width:0}
.it .t{display:flex;justify-content:space-between;gap:8px}
.it .nm{font-size:17px;overflow-wrap:anywhere}
.it small{color:var(--gr)}
.it .a{display:flex;align-items:center;gap:8px;margin-top:6px}
.it .a span{min-width:24px;text-align:center;font-weight:700}
.sp{flex:1}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;background:var(--ro);color:#fff;border:0;font-size:32px;box-shadow:0 8px 20px #2a314277;z-index:5}
.ov{position:fixed;inset:0;background:#0f1a2e99;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sh{background:#fff;width:100%;max-width:720px;max-height:90%;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh h2{margin:0 0 6px;font-size:22px}
.sh p{color:var(--mu);margin:4px 0 10px}
.fl{display:flex;gap:10px;margin-top:16px}.fl .bt{flex:1}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tp{position:relative;background:#fff;border-radius:16px;overflow:hidden;text-align:center;border:2px solid var(--ln);color:var(--ro);padding:0 0 8px}
.tp img,.tp i{width:100%;aspect-ratio:1;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:30px;font-style:normal;background:var(--ln);color:var(--ro)}
.tp b{display:block;font-weight:600;font-size:13px;padding:6px 4px 0;line-height:1.15}
.tp small{color:var(--gr);font-weight:600}
.tp em{position:absolute;top:6px;right:6px;background:var(--ro);color:#fff;border-radius:999px;font-style:normal;min-width:26px;height:26px;line-height:26px;font-weight:700;font-size:13px}
.em{text-align:center;color:var(--ro);padding:40px 20px;font-weight:500}
.sh .em{color:var(--mu)}
.ph{width:112px;height:112px;margin:12px auto 0;border-radius:20px;object-fit:cover;background:var(--ln);display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--ro)}
.tt{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gr);color:#fff;padding:10px 16px;border-radius:14px;z-index:40}
#splash{position:fixed;inset:0;z-index:100;background:#1c0267;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:min(50vw,210px);border-radius:26%;box-shadow:0 12px 36px #0008;animation:spl-p 1.6s ease-in-out infinite}
@keyframes spl-p{50%{transform:scale(1.05)}}
.spl-bar{width:min(64vw,260px);height:8px;border-radius:99px;background:#ffffff26;overflow:hidden}
.spl-bar i{display:block;height:100%;width:0;background:#9be03c;border-radius:99px;animation:spl-l 3.5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes spl-l{to{width:100%}}
#splash small{color:#fff;opacity:.85;font-family:'Poppins',system-ui,sans-serif;letter-spacing:.04em}
.spl-sk{width:min(80vw,320px);display:grid;gap:10px;margin-top:8px}
.spl-sk b{height:46px;border-radius:14px;background:linear-gradient(90deg,#ffffff12 25%,#ffffff2e 50%,#ffffff12 75%);background-size:200% 100%;animation:spl-s 1.2s linear infinite}
.spl-sk b:nth-child(2){opacity:.7}.spl-sk b:nth-child(3){opacity:.45}
@keyframes spl-s{to{background-position:-200% 0}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bd{width:46px;height:46px;border-radius:16px;background:var(--lt);color:var(--ro);display:flex;align-items:center;justify-content:center;font-size:26px}
.cm small{display:block;line-height:1.3}
.inf{color:var(--mu)}
.ics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.ic{background:#fff;border:2px solid var(--ln);border-radius:14px;padding:6px 2px;color:var(--ro)}
.ic span{display:block;font-size:24px;line-height:1.2}
.ic small{display:block;font-size:10px;font-weight:600}
.ic.on{background:var(--ro);border-color:var(--ro);color:#fff}
.srow{display:flex;gap:8px;margin-bottom:12px}
.srow input{flex:1}
select{font:inherit;color:var(--ro);background:#fff;border:2px solid var(--ln);border-radius:14px;padding:10px 8px;max-width:46%}
.cm.al1{box-shadow:0 0 0 3px #ffb300,0 4px 14px #2a314226}
.cm.al2{box-shadow:0 0 0 3px #e5484d,0 4px 14px #2a314226;animation:alp 1.6s ease-in-out infinite}
@keyframes alp{50%{box-shadow:0 0 0 6px #e5484d66,0 4px 14px #2a314226}}
.chip.a1{background:#ffb300;color:#23222b}
.chip.a2{background:#e5484d;color:#fff}
.alb{background:#fff;border-radius:14px;padding:9px 12px;margin-bottom:12px;font-weight:600;color:var(--ro);box-shadow:0 4px 14px #2a314226}
.sh.tall{min-height:68%;display:flex;flex-direction:column;justify-content:center}
.top2{display:block;text-align:center;color:var(--mu);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:12px;margin-bottom:6px}
.thx{text-align:center}
.thx .emo{font-size:52px;line-height:1.1}
.thx h2{font-size:26px;margin:6px 0 4px}
.thx .msg{color:var(--ro);font-size:18px;margin:6px 6px 8px;line-height:1.35}
.thx .est{color:var(--mu);font-size:14px;margin:0 0 14px;font-weight:600}
.sumb{background:#f0fada;border-radius:18px;padding:10px 14px;margin:12px 0;text-align:left}
.thx .note{color:var(--mu);font-size:12px;margin:6px 0 0}
.sw{width:52px;height:30px;border-radius:99px;border:0;background:#cfcadd;position:relative;flex:none;transition:.2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0004}
.sw.on{background:var(--ro)}
.sw.on i{left:25px}
#lg{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#lg[hidden]{display:none}
.lgc{background:#fff;border-radius:26px;padding:22px 18px;width:100%;max-width:380px;box-shadow:0 8px 28px #2a314244;text-align:center;display:grid;gap:12px}
.lgc img{width:96px;border-radius:26%;margin:0 auto;box-shadow:0 6px 18px #2a314255}
.lgc h2{margin:2px 0 0;font-size:22px}
#lm{color:#c2272d;font-weight:600;min-height:20px;margin:0;font-size:14px}
.lgc small{color:var(--mu);word-break:break-all}
.lgc button:disabled{opacity:.6}
:root{--bg:#f3f6fb;--pr:#3fa535;--mu:#7c8497;--ln:#e3e8f1;--gr:#2a3142}
body::before{background:#4aa935}
header{background:linear-gradient(180deg,#4aa935,#8cd33f);box-shadow:0 6px 18px #4aa93555}
.bt,.bt.ro{background:var(--pr)}
.bt.gh{background:#fff;color:var(--pr);border:2px solid var(--pr)}
.q,.fab,.tp em,.ic.on,.sw.on{background:var(--pr)}
.ic.on{border-color:var(--pr)}
.fab{box-shadow:0 8px 20px #3fa53577}
.tabs button{background:#fff;color:var(--ro)}
.tabs .on{background:var(--pr);color:#fff}
input:focus,textarea:focus{border-color:var(--pr)}
.th,.ph{color:var(--ro)}
header.mh{padding:14px 14px 18px;gap:12px}
.num{width:46px;height:46px;border-radius:50%;background:#ffffff33;border:0;color:#fff;font:700 20px 'Poppins',system-ui,sans-serif}
.who{flex:1;text-align:left;background:none;border:0;color:#fff;padding:0;min-width:0}
.who b{display:block;font-size:19px;font-weight:600}
.who b i{font-style:normal;font-size:14px;opacity:.9}
.who small{display:block;opacity:.92;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bell{position:relative;width:46px;height:46px;border-radius:50%;background:#ffffff33;border:0;color:#fff;display:flex;align-items:center;justify-content:center}
.bell em{position:absolute;top:1px;right:1px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font:700 11px/18px system-ui,sans-serif;font-style:normal;text-align:center;padding:0 4px}
.mn{display:flex;align-items:center;gap:16px;background:#fff;border-radius:18px;padding:18px 16px;margin-bottom:14px;box-shadow:0 6px 18px #1f2a4414;width:100%;border:0;text-align:left;color:var(--ro)}
.mn:active{transform:scale(.99)}
.mn .ci{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 6px 12px #0003}
.mn .tx{flex:1;min-width:0}
.mn b{display:block;font-size:18px;font-weight:500;font-family:system-ui,sans-serif}
.mn small{color:var(--mu);font-size:14px}
.mn .ch{color:#b4bbc9;font-size:26px}
.nv{background:linear-gradient(135deg,#4aa935,#8cd33f);color:#fff;border-radius:18px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px #4aa93555}
.nv>div{flex:1}
.nv b{display:block}
.nv small{display:block;opacity:.95}
.nv .bt{background:#fff;color:#2f8a24;border:0;flex:none}
.lr{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:0;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 4px 14px #1f2a4414;text-align:left;color:var(--ro)}
.lr .bd2{width:44px;height:44px;border-radius:14px;background:var(--lt);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.lr .tx{flex:1;min-width:0}
.lr .tx b{display:block;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.lr small{color:var(--mu)}
.lr .v{font-size:17px;font-weight:700}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.mt{background:#fff;border:2px solid var(--lt);border-radius:16px;padding:10px 4px;text-align:center;color:var(--ro);min-height:84px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.mt b{font-size:22px;font-weight:700}
.mt small{color:var(--mu);font-size:12px;font-weight:600}
.mt em{font-style:normal;font-size:11px;color:var(--mu)}
.mt.oc{background:var(--pr);border-color:var(--pr);color:#fff}
.mt.oc small,.mt.oc em{color:#fff}
.mt.al1{background:#ffb300;border-color:#ffb300;color:#2a3142}
.mt.al1 small,.mt.al1 em{color:#2a3142}
.mt.al2{background:#e5484d;border-color:#e5484d;color:#fff}
.lg{display:flex;gap:14px;font-size:13px;color:var(--ro);margin-bottom:10px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.d0{background:#fff;border:2px solid var(--lt)}.d1{background:var(--pr)}.d2{background:#ffb300}
.mst{margin:14px 2px 8px;font-size:15px;color:var(--mu);font-weight:600}
.fp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 8px}
.fp button{padding:10px 2px;border-radius:12px;border:2px solid var(--ln);background:#fff;color:var(--ro);font-size:13px;font-weight:600}
.fp .on{background:var(--pr);border-color:var(--pr);color:#fff}
.x{border:0;background:#eef1f6;color:var(--ro);border-radius:8px;width:28px;height:28px}
.cp{white-space:pre-wrap;background:#f7f9fc;border:1px dashed #b9c1d1;border-radius:14px;padding:12px;font:13px/1.45 ui-monospace,monospace;color:var(--gr)}
.sob{text-align:center}
.sob img{width:84px;border-radius:26%;box-shadow:0 6px 16px #0003}
.sob h2{margin:8px 0 0}
.nt{font-size:13px}

function go(v,id){const p=view=='cmd'?getC():null;
 if(p&&p.auto&&p.a&&!p.i.length&&v!='cmd'){db.c=db.c.filter(x=>x.id!=p.id);save()}
 if(v!=view&&v!='cmd')bq='';
 view=v;if(id!==undefined)cur=id;render();scrollTo(0,0)}
function voltar(){if($('#m').innerHTML){cl();return true}if(view=='cmd'){go(cfrom||'home');return true}if(view!='menu'){go('menu');return true}return false}
if(!window.Android){try{history.pushState({g:1},'');addEventListener('popstate',()=>{if(voltar())history.pushState({g:1},'');else history.back()})}catch(e){}}

function render(){
 const a=$('#app');
 if(view=='menu')a.innerHTML=menuView();
 else if(view=='home')a.innerHTML=home();
 else if(view=='cmd')a.innerHTML=cmdView();
 else if(view=='prod')a.innerHTML=prodView();
 else if(view=='mapa')a.innerHTML=mapaView();
 else if(view=='cx')a.innerHTML=cxView();
 else if(LV[view])a.innerHTML=listaView();
 else a.innerHTML=menuView();
 if(view=='cmd')upd();
}
/* ---------- HOME ---------- */
const ICS=['🪑','🛋️','👑','🥂','🍺','👤','🎉','🌴','🛵','⭐'];
const ICN={'🪑':'Mesa','🛋️':'Lounge','👑':'VIP','🥂':'Camarote','🍺':'Balcão','👤':'Cliente','🎉':'Evento','🌴':'Externa','🛵':'Viagem','⭐':'Outro'};
const K2E={mesa:'🪑',lounge:'🛋️',vip:'👑',camarote:'🥂',balcao:'🍺',cliente:'👤',evento:'🎉',externa:'🌴',viagem:'🛵',outro:'⭐'};
const ik=c=>ICS.includes(c.ic)?c.ic:(K2E[c.ic]||icFor(c.n));
let icSel='🪑',icMan=0,bq='';
const ico=()=>db.ico!==false;
const nrm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function icFor(n){n=nrm(n).trim();
 if(/vip/.test(n))return'👑';if(/lounge|lauge|louge|lunge/.test(n))return'🛋️';if(/camarote/.test(n))return'🥂';
 if(/balc/.test(n))return'🍺';if(/deliver|viagem|retirada|moto|entrega/.test(n))return'🛵';
 if(/aniv|evento|festa|confrat/.test(n))return'🎉';if(/extern|varanda|jardim|calcada|area/.test(n))return'🌴';
 if(/mesa|^\d+$/.test(n))return'🪑';return n?'👤':'🪑'}
const icGrid=sel=>ICS.map(i=>`<button class="ic${i==sel?' on':''}" onclick="icPick('${i}')"><span>${i}</span><small>${ICN[i]}</small></button>`).join('');
function icPick(i){icSel=i;icMan=1;$('#ics').innerHTML=icGrid(i)}
function icAut(){if(icMan||!$('#ics'))return;icSel=icFor($('#f1').value);$('#ics').innerHTML=icGrid(icSel)}
const fdt=t=>{const d=new Date(t),h=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
 return (new Date().toDateString()==d.toDateString()?'Hoje':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}))+' às '+h};
const dur=ms=>{const m=Math.max(0,Math.floor(ms/60000)),h=Math.floor(m/60);return h?h+'h'+String(m%60).padStart(2,'0'):m+' min'};
const alv=c=>{if(!c.a)return 0;const L=db.al==null?3:db.al;if(!(L>0))return 0;const h=(Date.now()-c.t)/36e5;return h>=2*L?2:h>=L?1:0};
const card=c=>{const l=alv(c),ms=(c.a?Date.now():(c.f||c.t))-c.t;
 return `<div class="cm ${c.a?'':'f'}${l?' al'+l:''}" onclick="openC('${c.id}','home')"><div class="top">${ico()?`<span class="bd">${ik(c)}</span>`:''}<span class="chip${l?' a'+l:''}">${l?'⚠ '+dur(ms):c.a?'Aberta':'Encerrada'}</span></div><div class="nm">${esc(c.n)}</div><div><small>🕒 ${fdt(c.t)} · ${dur(ms)}</small>${c.a?'':`<small>Fechada ${fdt(c.f||c.t)}</small>`}<small>${c.i.reduce((s,i)=>s+i.q,0)} itens</small></div><div class="vl">${brl(tot(c))}</div></div>`};
function gl(){const k=nrm(bq).trim(),o=db.ord||'t';
 const list=db.c.filter(c=>(tab=='a'?c.a:!c.a)&&(!k||nrm(c.n).includes(k))).sort((x,y)=>o=='v'?tot(y)-tot(x):o=='n'?x.n.localeCompare(y.n,'pt-BR',{numeric:true,sensitivity:'base'}):tab=='a'?x.t-y.t:(y.f||0)-(x.f||0));
 const n=tab=='a'?db.c.filter(c=>alv(c)>0).length:0,L=db.al==null?3:db.al;
 const ban=n&&!k?`<div class="alb">⚠ ${n} comanda${n>1?'s':''} aberta${n>1?'s':''} há mais de ${String(L).replace('.',',')}h</div>`:'';
 return ban+(list.length?`<div class="grid" style="grid-template-columns:repeat(${db.g},1fr)">${list.map(card).join('')}</div>`:`<div class="em">${k?'Nenhuma comanda encontrada.':tab=='a'?'Nenhuma comanda aberta. Toque em + para abrir uma mesa.':'Nenhuma comanda encerrada.'}</div>`)}
function home(){
 const nA=db.c.filter(c=>c.a).length,nF=db.c.length-nA;
 return `<header><button class="ib" onclick="go('menu')" aria-label="Voltar">←</button><h1>Pedido</h1><button class="ib" onclick="db.g=db.g%3+1;save();render()" aria-label="Colunas">▦</button></header>
 <main>
 ${stor=='no'?'<div class="alb">⚠ Sem armazenamento: exporte o backup (⋮)</div>':''}
 <div class="srow"><input id="bs" placeholder="Buscar comanda" value="${esc(bq)}" oninput="bq=this.value;$('#gl').innerHTML=gl()"><select id="so" aria-label="Ordenar" onchange="db.ord=this.value;save();$('#gl').innerHTML=gl()"><option value="t"${(db.ord||'t')=='t'?' selected':''}>Mais tempo aberto</option><option value="v"${db.ord=='v'?' selected':''}>Maior valor</option><option value="n"${db.ord=='n'?' selected':''}>Nome A–Z</option></select></div>
 <div class="tabs"><button class="${tab=='a'?'on':''}" onclick="tab='a';render()">Abertas (${nA})</button><button class="${tab=='f'?'on':''}" onclick="tab='f';render()">Encerradas (${nF})</button></div>
 <div id="gl">${gl()}</div>
 </main><button class="fab" onclick="novaC()" aria-label="Nova comanda">+</button>`;
}
function novaC(){icSel='🪑';icMan=0;sheet(`<h2>Nova comanda</h2><p>${ico()?'Nome da mesa ou do cliente, e o tipo.':'Nome da mesa ou do cliente.'}</p><input id="f1" placeholder="Ex.: Mesa 4, Lounge, VIP, Adriana" oninput="icAut()" autofocus>${ico()?`<div class="ics" id="ics">${icGrid(icSel)}</div>`:''}<div class="fl"><button class="bt gh" onclick="cl()">Cancelar</button><button class="bt ro" onclick="criaC()">Abrir</button></div>`)}
function criaC(){const n=$('#f1').value.trim();if(!n){toast('Digite o nome da comanda');return}
 const c={id:uid(),n,ic:ico()?icSel:icFor(n),a:1,t:Date.now(),pct:db.pct,pe:0,i:[]};db.c.push(c);save();cl();openC(c.id,'home')}
const PINH=`<h2>Senha do garçom</h2><p>Digite a senha para abrir as opções.</p><input id="pn" type="password" inputmode="numeric" placeholder="Senha" autofocus><div class="fl"><button class="bt gh" onclick="cl()">Cancelar</button><button class="bt ro" onclick="pinOk()">Entrar</button></div>`;
function menuG(){if(db.pin&&unl<Date.now()){pcb=menu;sheet(PINH);return}menu()}
function tgIco(b){db.ico=!ico();save();b.classList.toggle('on',ico());if(view=='home'&&$('#gl'))$('#gl').innerHTML=gl()}
function menu(){const ab=db.c.filter(c=>c.a),fe=db.c.filter(c=>!c.a);sheet(`<h2>Opções</h2><div class="sumb"><div class="r"><span>Em aberto (${ab.length})</span><b>${brl(ab.reduce((x,c)=>x+tot(c),0))}</b></div><div class="r"><span>Vendido (encerradas)</span><b>${brl(fe.reduce((x,c)=>x+tot(c),0))}</b></div></div><div class="r"><span>Ícones nas comandas (emojis)</span><button class="sw${ico()?' on':''}" onclick="tgIco(this)" aria-label="Ativar ou desativar ícones"><i></i></button></div><div class="r"><span>Alertar comanda aberta há (horas)</span><input class="sm" id="al" inputmode="decimal" value="${db.al==null?3:String(db.al).replace('.',',')}" oninput="db.al=num(this.value);save();if(view=='home'&&$('#gl'))$('#gl').innerHTML=gl()"></div><p>Amarelo no tempo definido e vermelho no dobro. Use 0 para desligar.</p> <input id="est" placeholder="Nome do estabelecimento (aparece ao encerrar)" value="${esc(db.est||'')}" oninput="db.est=this.value;save()" style="margin-top:6px"><input id="msg" placeholder="Mensagem de agradecimento (opcional)" value="${esc(db.msg||'')}" oninput="db.msg=this.value;save()" style="margin-top:8px"><p>Dados salvos ${stor=='idb'?'neste aparelho (IndexedDB)':stor=='ls'?'neste aparelho (localStorage)':'<b>somente enquanto a página estiver aberta</b>'}. Exporte um backup com frequência.</p><div class="fl"><button class="bt ro" onclick="expo()">Exportar backup</button><button class="bt gh" onclick="$('#fb').click()">Importar</button></div><input id="fb" type="file" accept=".json,application/json" hidden onchange="impo(this)">${LIC_ON&&lic?`<p>Licenciado para: <b>${esc(lic.nome||'')}</b><br>Terminal: ${esc(TERM)}</p><button class="bt gh" style="width:100%" onclick="sair()">Sair da conta</button>`:''}<div class="fl"><button class="bt gh" onclick="cl()">Fechar</button></div>`)}
function expo(){if(window.Android){Android.salvar('comandas-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db));return}const b=new Blob([JSON.stringify(db)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='comandas-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}
function impo(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.c||!d.p)throw 0;db=d;save();cl();render();toast('Backup restaurado')}catch(e){toast('Arquivo inválido')}};r.readAsText(f)}

 return `<header><button class="ib" onclick="go(cfrom||'home')" aria-label="Voltar">←</button><h1>${ico()?ik(c)+' ':''}${esc(c.n)}</h1>${ab?`<button class="ib" onclick="addSheet()" aria-label="Cardápio">🍸</button><button class="ib" onclick="ren()" aria-label="Opções">✎</button><button class="ib" onclick="pagar('${c.id}')" aria-label="Pagamento">$</button>`:`<button class="ib" onclick="del()" aria-label="Excluir">🗑</button>`}</header>
 <main><div class="box">
 <div class="r"><small class="inf"${alv(c)?` style="color:${alv(c)>1?'#e5484d':'#c98300'};font-weight:600"`:''}>${alv(c)?'⚠ ':''}🕒 Aberta ${fdt(c.t)} · ${dur((ab?Date.now():(c.f||c.t))-c.t)}${ab?'':' · encerrada '+fdt(c.f||c.t)}</small></div>

 <div class="r"><span>Dividir por</span><input class="sm" id="pe" inputmode="numeric" value="${c.pe||''}" placeholder="pessoas" oninput="chg()"><b id="pp"></b></div>
