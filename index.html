<script>
const $=s=>document.querySelector(s);
let db={c:[],p:[],g:2,pct:10},stor='no';
const idb=()=>new Promise((ok,no)=>{try{const r=indexedDB.open('comandas',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
async function load(){
 try{const d=await idb();const v=await new Promise((ok,no)=>{const q=d.transaction('k').objectStore('k').get('db');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});if(v)db=v;stor='idb'}
 catch(e){try{const v=JSON.parse(localStorage.getItem('cmd1')||'null');if(v)db=v;localStorage.setItem('cmd1x','1');stor='ls'}catch(e2){stor='no'}}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 render()}
let view='menu',cur=null,tab='a',ft=0;
const save=async()=>{try{
 if(stor=='idb'){const d=await idb();await new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(db,'db');t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error('abort'))});d.close()}
 else if(stor=='ls')localStorage.setItem('cmd1',JSON.stringify(db));
 else toast('Sem armazenamento neste navegador: exporte o backup');
 nuvAgenda()}catch(e){nuvAgenda();stor=stor=='idb'?'idb':'no';toast('Não foi possível salvar neste aparelho. O cardápio continua sendo enviado para a nuvem.')}};
/* ---- cópia do cardápio na nuvem (Firestore, por licença) ---- */
const nuv={ok:false,t:null,tm:null,last:'',started:false,busy:false,err:''};
const nuvDados=()=>JSON.stringify({p:db.p,est:db.est||'',msg:db.msg||'',pct:db.pct,al:db.al});
const nuvCol=()=>fdb.collection('licencas').doc(lic.uid).collection('dados');
function nuvAgenda(){if(!nuv.ok)return;clearTimeout(nuv.tm);nuv.tm=setTimeout(()=>nuvPush(),15000)}
function nuvMsg(){return !fdb||!lic||!lic.uid?'Entre na sua conta para salvar na nuvem':!navigator.onLine?'Sem internet no aparelho':/permission/.test(nuv.err)?'Sem permissão na nuvem: publique as regras novas do Firebase':'Não foi possível falar com a nuvem. Tente de novo'}
async function nuvPush(man){
 if(man&&!nuv.ok&&fdb&&lic&&lic.uid&&navigator.onLine){nuv.started=false;await nuvPull()}
 if(!nuv.ok||nuv.busy||!fdb||!lic||!lic.uid||!navigator.onLine){if(man)toast(nuvMsg());return}
 const t=nuvDados();if(t==nuv.last&&!man)return;
 nuv.busy=true;
 try{const col=nuvCol(),old=await col.doc('meta').get(),on=old.exists?(old.data().n||0):0,N=300000,n=Math.max(1,Math.ceil(t.length/N)),b=fdb.batch();
  for(let k=0;k<n;k++)b.set(col.doc('c'+k),{s:t.slice(k*N,(k+1)*N)});
  for(let k=n;k<on;k++)b.delete(col.doc('c'+k));
  b.set(col.doc('meta'),{n,t:Date.now(),qtd:db.p.length});
  await b.commit();nuv.last=t;nuv.t=Date.now();if(man)toast('Cardápio salvo na nuvem')}
 catch(e){nuv.err=(e&&e.code)||'';if(man)toast(/permission/.test(nuv.err)?nuvMsg():'Não foi possível salvar na nuvem')}
 nuv.busy=false}
async function nuvPull(){
 if(nuv.started||!fdb||!lic||!lic.uid||!navigator.onLine)return;nuv.started=true;
 try{const col=nuvCol(),m=await col.doc('meta').get();
  if(m.exists&&!db.p.length){let t='';for(let k=0;k<(m.data().n||0);k++){const d=await col.doc('c'+k).get();t+=d.data().s}
   const o=JSON.parse(t);db.p=o.p||[];if(!db.est)db.est=o.est||'';if(!db.msg)db.msg=o.msg||'';await save();render();toast('Cardápio restaurado da nuvem: '+db.p.length+' produtos')}
  if(m.exists)nuv.t=m.data().t;
  nuv.ok=true;nuv.last=(m.exists&&!db.p.length)?'':nuv.last;nuvAgenda()}
 catch(e){nuv.err=(e&&e.code)||'';nuv.started=false}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='hidden'){clearTimeout(nuv.tm);nuvPush()}else if(!nuv.ok)nuvPull()});
const brl=n=>'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=s=>{s=String(s).replace(/[^\d.,]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sub=c=>c.i.reduce((s,i)=>s+i.v*i.q,0);
const taxa=c=>c.fx!=null?c.fx:sub(c)*c.pct/100;
const tot=c=>sub(c)+taxa(c);
const getC=()=>db.c.find(c=>c.id==cur);
const prod=id=>db.p.find(p=>p.id==id);
/* ---- imagens modelo (pasta modelos/ do GitHub Pages) ---- */
const sn=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const toks=t=>sn(t).replace(/\.[a-z0-9]+$/,'').split(/[^a-z0-9]+/).filter(x=>x&&x.length>2).map(x=>x.replace(/s$/,''));
let MOD=null;
async function modelos(){
 let l=[];
 try{const r=await fetch('modelos/lista.json?'+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();l=(Array.isArray(j)?j:j.arquivos||[]).map(x=>typeof x=='string'?{f:x}:x)}}catch(e){}
 if(!l.length){try{const m=location.hostname.match(/^(.+)\.github\.io$/),rp=location.pathname.split('/')[1];
  if(m&&rp){const r=await fetch('https://api.github.com/repos/'+m[1]+'/'+rp+'/contents/modelos?'+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();l=j.filter(x=>x.type=='file'&&/\.(jpe?g|png|webp)$/i.test(x.name)).map(x=>({f:x.name}))}}}catch(e){}}
 l=l.filter(x=>x&&x.f).map(x=>({f:x.f,n:x.n||x.f,k:toks(x.n||x.f)}));
 if(l.length){MOD=l;try{localStorage.setItem('mod1',JSON.stringify({t:Date.now(),l}))}catch(e){}return l}
 try{const c=JSON.parse(localStorage.getItem('mod1')||'null');if(c&&c.l&&c.l.length){MOD=c.l;return MOD}}catch(e){}
 return[]}
const igual=(a,b)=>a==b||(a.length>=4&&b.length>=4&&(a.startsWith(b)||b.startsWith(a)));
function acha(nome,l){const pt=toks(nome);let best=null,bs=0;
 for(const m of l){if(!m.k.length||!m.k.every(k=>pt.some(p=>igual(p,k))))continue;const sc=m.k.length;if(sc>bs){bs=sc;best=m}}
 return best}
function carrega(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',.72))};im.onerror=no;im.src='modelos/'+encodeURIComponent(f)})}

 sheet('<h2>Imagens modelo</h2><p>Procurando imagens…</p>');

 if(!l.length){sheet('<h2>Imagens modelo</h2><p>Sem internet ou nenhuma imagem modelo publicada ainda.</p><div class="fl"><button class="bt gh" onclick="cl()">Fechar</button></div>');return}

async function modAplica(){
 const inc=$('#mt')&&$('#mt').classList.contains('on'),l=await modelos();let n=0,t=0;
 const alvo=db.p.filter(p=>!p.img||(inc&&/^https?:/.test(p.img)));

function rn2(){const n=$('#f1').value.trim();if(!n){toast('Digite um nome');return}getC().n=n;if(ico())getC().ic=icSel;const pn=$('#pn');if(pn&&pn.value.trim()){db.pin=hs(pn.value.trim());unl=Date.now()+120000}save();cl();render()}
function del(){sheet(`<h2>Excluir comanda</h2><p>Esta ação apaga a comanda e todos os itens.</p><div class="fl"><button class="bt gh" onclick="cl()">Cancelar</button><button class="bt ro" onclick="del2()">Excluir</button></div>`)}
function del2(){db.c=db.c.filter(c=>c.id!=cur);save();cl();go(cfrom||'home')}
const FRASES=['Foi um prazer receber você. Volte sempre!','Obrigado por escolher a gente. Sua companhia fez a noite melhor!','Que a noite tenha sido incrível. Estaremos aqui para a próxima!','Boas histórias começam à mesa. Até a próxima!','Agradecemos a preferência. Esperamos você de novo em breve!'];
function fechar(){const c=getC(),h=[...c.id].reduce((x,ch)=>x+ch.charCodeAt(0),0);
 const nome=ik(c)=='👤'?esc(c.n.trim().split(/\s+/)[0]):'';
 const msg=(db.msg||'').trim()?esc(db.msg.trim()):FRASES[h%FRASES.length];
 const itens=c.i.reduce((x,i)=>x+i.q,0);
 sheet(`<small class="top2">Encerrar comanda</small><div class="thx">${ico()?'<div class="emo">🥂</div>':''}<h2>${nome?'Obrigado, '+nome+'!':'Obrigado pela visita!'}</h2><p class="msg">${msg}</p>${(db.est||'').trim()?`<p class="est">${esc(db.est.trim())}</p>`:''}<div class="sumb"><div class="r"><span>Itens</span><b>${itens}</b></div><div class="r"><span>Tempo com a gente</span><b>${dur(Date.now()-c.t)}</b></div>${pgRows(c)}<div class="r big"><span class="bree">Total</span><b>${brl(tot(c))}</b></div>${c.pe>0?`<div class="r"><span>Por pessoa (${c.pe})</span><b>${brl(tot(c)/c.pe)}</b></div>`:''}</div><p class="note">Depois de encerrada, só é possível ver ou reabrir a comanda.</p></div><div class="fl"><button class="bt gh" onclick="cl()">Cancelar</button><button class="bt ro" onclick="fec2()">Encerrar</button></div>`,'tall')}
function fec2(){const c=getC();c.tx=taxa(c);c.a=0;c.f=Date.now();c.r=0;save();cl();render()}
function reabrir(){const c=getC();c.a=1;c.r=0;save();render()}

function addSheet(){
 sheet(`<h2>Adicionar item</h2><input id="q" placeholder="Buscar no cardápio" oninput="tl()"><div class="tl" id="tl"></div>
 <p style="margin-top:16px">Item avulso: informe a descrição e o valor.</p>
 <div class="fl" style="margin-top:0"><input id="f1" placeholder="Descrição"><input id="f2" inputmode="decimal" placeholder="Valor"></div>
 <div class="fl"><button class="bt gh" onclick="cl()">Fechar</button><button class="bt ro" onclick="avulso()">Adicionar avulso</button></div>`);tl()}
function tl(){const q=($('#q')||{value:''}).value.toLowerCase(),c=getC();
 const l=db.p.filter(p=>p.n.toLowerCase().includes(q));
 $('#tl').innerHTML=l.length?l.map(p=>{const it=c.i.find(i=>i.pid==p.id);return `<button class="tp" onclick="addP('${p.id}')"><div class="ti">${p.img?`<img src="${p.img}" alt="" onerror="this.remove()">`:''}</div>${it?`<em>${it.q}</em>`:''}<b>${esc(p.n)}</b><small>${brl(p.v)}</small></button>`}).join(''):`<div class="em" style="grid-column:1/-1;padding:16px">${db.p.length?'Nenhum produto encontrado.':'Cardápio vazio. Cadastre produtos na tela 🍸 da lista de comandas.'}</div>`}
function addP(id){const c=getC(),p=prod(id);let i=c.i.find(x=>x.pid==id&&x.v==p.v);
 if(i)i.q++;else c.i.push({id:uid(),pid:id,d:p.n,v:p.v,q:1});
 save();tl();render()}
function avulso(){const d=$('#f1').value.trim(),v=num($('#f2').value);
 if(!d||v<=0){toast('Preencha descrição e valor');return}
 getC().i.push({id:uid(),d,v,q:1});save();cl();render()}

const dl=(n,t)=>{if(window.Android){Android.salvar(n,'\uFEFF'+t);return}const b=new Blob(['\uFEFF'+t],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove()};
const q2=x=>'"'+String(x).replace(/"/g,'""')+'"';
function modelo(){dl('modelo-produtos.csv','imagem;valor;nome\nhttps://exemplo.com/cerveja.jpg;12,50;Cerveja long neck\nhttps://exemplo.com/gelo.jpg;5,00;Gelo\n')}
function expP(){dl('produtos.csv','imagem;valor;nome\n'+db.p.map(p=>[q2(p.img||''),q2(String(p.v).replace('.',',')),q2(p.n)].join(';')).join('\n'))}
function csv(t){const l=t.split(/\r?\n/)[0]||'';const d=['\t',';',','].map(x=>[x,l.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}
  else if(ch=='"')q=1;else if(ch==d){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=ch}
 if(c!==''||r.length){r.push(c);R.push(r)}return R}
function rowsImport(R){let n=0,u=0;R.forEach(r=>{let im=null,v=null,nm=null;
 r.forEach(x=>{x=String(x==null?'':x).trim();if(!x)return;
  if(/^(https?:\/\/|data:image)/i.test(x))im=x;
  else if(v==null&&/^(R\$)?[\d.,]+$/i.test(x.replace(/\s/g,'')))v=num(x);
  else if(nm==null)nm=x});
 if(!nm||!(v>0))return;
 const p=db.p.find(p=>p.n.toLowerCase()==nm.toLowerCase());
 if(p){p.v=v;if(im)p.img=im;u++}else{db.p.push({id:uid(),n:nm,v,img:im});n++}});
 if(!n&&!u){toast('Nenhum produto encontrado: use colunas imagem, valor e nome');return}
 save();cl();render();toast(n+' novos, '+u+' atualizados')}
const lib=()=>window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
function readSheet(el){const f=el.files[0];if(!f)return;const r=new FileReader();
 if(/\.xlsx?$/i.test(f.name)){r.onload=async()=>{try{await lib();const w=XLSX.read(r.result,{type:'array'});rowsImport(XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,raw:true,defval:''}))}catch(e){toast('Não foi possível ler o Excel. Salve como CSV e tente de novo')}};r.readAsArrayBuffer(f)}
 else{r.onload=()=>rowsImport(csv(String(r.result).replace(/^\uFEFF/,'')));r.readAsText(f)}}
function pasteImp(){rowsImport(csv($('#ta').value))}
function impSheet(){sheet(`<h2>Importar produtos</h2><p>Use uma planilha com imagem (link da foto), valor e nome do produto, em qualquer ordem. Aceita CSV, Excel ou células coladas. Produto com o mesmo nome é atualizado.</p><div class="fl" style="margin-top:0"><button class="bt" onclick="$('#fs').click()">Escolher arquivo</button><button class="bt gh" onclick="modelo()">Baixar modelo</button></div><input id="fs" type="file" accept=".csv,.tsv,.txt,.xlsx,.xls" hidden onchange="readSheet(this)"><textarea id="ta" rows="5" placeholder="Ou cole aqui as linhas copiadas da planilha"></textarea><div class="fl"><button class="bt gh" onclick="cl()">Fechar</button><button class="bt" onclick="pasteImp()">Importar colado</button></div>`)}
function prodView(){
 return `<header><button class="ib" onclick="go('menu')" aria-label="Voltar">←</button><h1>Cardápio</h1></header><main>
 <div class="box"><div class="r"><b>Planilha de produtos</b><small>${db.p.length} cadastrados</small></div><div class="fl" style="margin-top:8px"><button class="bt" onclick="impSheet()">Importar</button><button class="bt gh" onclick="expP()">Exportar CSV</button></div><button class="bt gh" style="width:100%;margin-top:8px" onclick="modAuto()">🖼 Imagens modelo para os produtos</button></div>
 ${db.p.length?db.p.map(p=>`<div class="it">${thumb(p.img,p.n)}<div class="c"><div class="t"><span class="nm">${esc(p.n)}</span><b class="vl">${brl(p.v)}</b></div><div class="a"><div class="sp"></div><button class="q" onclick="pForm('${p.id}')">✎</button><button class="q" style="background:var(--or)" onclick="pDel('${p.id}')">🗑</button></div></div></div>`).join(''):`<div class="em">Nenhum produto. Toque em + para cadastrar com foto e preço.</div>`}
 </main><button class="fab" onclick="pForm()" aria-label="Novo produto">+</button>`;
}
let pimg=null;
function pForm(id){const p=id?prod(id):null;window._pid=id;if(!window._pf)pimg=p?p.img||null:null;
 sheet(`<h2>${p?'Editar produto':'Novo produto'}</h2><div id="pv" class="ph" onclick="$('#fi').click()">${pimg?`<img class="ph" style="margin:0" src="${pimg}">`:'📷'}</div><input id="fi" type="file" accept="image/*" hidden onchange="pPick(this)">
 <p style="text-align:center">Toque na imagem para escolher a foto.</p><button class="bt gh" style="width:100%;margin-bottom:8px" onclick="modGal()">🖼 Usar imagem modelo</button><input id="f1" value="${p?esc(p.n):''}" placeholder="Nome do produto"><input id="f2" inputmode="decimal" value="${p?String(p.v).replace('.',','):''}" placeholder="Preço" style="margin-top:8px">
 <div class="fl"><button class="bt gh" onclick="window._pf=null;cl()">Cancelar</button><button class="bt ro" onclick="pSave('${id||''}')">Salvar</button></div>`);
 if(window._pf){$('#f1').value=window._pf.n;$('#f2').value=window._pf.v;window._pf=null}}
function pPick(el){const f=el.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);pimg=cv.toDataURL('image/jpeg',.7);$('#pv').innerHTML=`<img class="ph" style="margin:0" src="${pimg}">`};im.src=r.result};r.readAsDataURL(f)}
function pSave(id){const n=$('#f1').value.trim(),v=num($('#f2').value);if(!n||v<=0){toast('Preencha nome e preço');return}
 if(id){const p=prod(id);p.n=n;p.v=v;p.img=pimg}else db.p.push({id:uid(),n,v,img:pimg});
 save();cl();render()}
function pDel(id){sheet(`<h2>Excluir produto</h2><p>As comandas que já usam este produto não mudam.</p><div class="fl"><button class="bt gh" onclick="cl()">Cancelar</button><button class="bt ro" onclick="db.p=db.p.filter(p=>p.id!='${id}');save();cl();render()">Excluir</button></div>`)}

const showLg=m=>{$('#lg').hidden=false;$('#tm').textContent=TERM;lgMsg(m)};
const hideLg=()=>{$('#lg').hidden=true;lgMsg('')};
const agoraSeg=()=>{const n=Date.now();let m=0;try{m=+localStorage.getItem('tmax')||0}catch(e){}const v=Math.max(n,m);try{localStorage.setItem('tmax',v)}catch(e){}return v};
const MSG_TESTE='Seu período de teste terminou. Fale com o suporte para ativar a licença vitalícia.';
const expirou=x=>!!x&&agoraSeg()>x;
const restam=x=>{const m=Math.max(0,x-agoraSeg()),h=Math.floor(m/36e5),d=Math.floor(h/24);return d>=2?d+' dias':h>=1?h+'h '+Math.floor(m%36e5/6e4)+'min':Math.max(1,Math.ceil(m/6e4))+' min'};
const chk=d=>!d?'Licença não encontrada. Fale com o suporte.':!d.ativo?'Licença inativa. Fale com o suporte.':expirou(d.expiraEm)?MSG_TESTE:d.sessao!==lic.sessao?'Sua conta foi acessada em outro aparelho.':'';
const msgErro=e=>{if(e&&e.m)return e.m;const c=(e&&e.code)||'';
 if(/wrong-password|invalid-credential|user-not-found|invalid-email/.test(c))return'Usuário ou senha incorretos.';
 if(/too-many-requests/.test(c))return'Muitas tentativas. Aguarde alguns minutos.';
 if(/network/.test(c))return'Sem internet. Conecte-se para entrar.';
 if(/permission-denied/.test(c))return'Sem permissão. Fale com o suporte.';
 return'Não foi possível entrar. Tente novamente.'};
function forceOut(m){if(unsub){unsub();unsub=null}delLic();lic=null;try{auth&&auth.signOut()}catch(e){}showLg(m)}
let iniT=false;
function iniciaTeste(d,id){if(iniT||!d||!d.teste||d.expiraEm||!(d.testeMs>0)||!fdb)return;iniT=true;const x=Date.now()+d.testeMs;
 fdb.collection('licencas').doc(id).update({expiraEm:x}).then(()=>{if(lic){lic.exp=x;setLic(lic)}render()}).catch(()=>{iniT=false})}
let hbT=null;
function batida(id){if(hbT)clearInterval(hbT);const bt=()=>{if(document.visibilityState=='visible'&&navigator.onLine)fdb.collection('licencas').doc(id).update({visto:Date.now()}).catch(()=>{})};bt();hbT=setInterval(bt,600000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')bt()})}
function watch(id){if(unsub)unsub();batida(id);nuvPull();
 unsub=fdb.collection('licencas').doc(id).onSnapshot(s=>{
  if(!lic)return;
  const m=chk(s.exists?s.data():null);
  if(m){forceOut(m);return}
  if(!s.metadata.fromCache){iniciaTeste(s.data(),id);lic.ver=Date.now();lic.nome=s.data().nome||lic.nome;lic.exp=s.data().expiraEm||null;setLic(lic);if(view=='menu')render()}
 },()=>{})}
function licInit(){
 if(!LIC_ON)return;
 const sp=document.querySelector('#splash img'),lg=$('#lgl');if(sp&&lg)lg.src=sp.src;
 const su=$('#ls');if(su&&LIC.suporte)su.textContent='Suporte: '+LIC.suporte;
 lic=getLic();
 if(lic&&expirou(lic.exp)){delLic();lic=null;showLg(MSG_TESTE);return}
 const ok=lic&&Date.now()-lic.ver<=LIC.gracaDias*864e5;
 ok?hideLg():showLg(lic?'Conecte à internet para validar sua licença.':'');
 if(!window.firebase)return;
 try{
  if(!firebase.apps.length)firebase.initializeApp(FB);
  auth=firebase.auth();fdb=firebase.firestore();
  auth.onAuthStateChanged(u=>{
   if(!lic)return;
   if(!u){forceOut('Sessão expirada. Entre novamente.');return}
   if(u.uid!==lic.uid){forceOut('Entre novamente.');return}
   fdb.collection('licencas').doc(u.uid).get().then(s=>{
    if(!lic)return;
    const m=chk(s.exists?s.data():null);
    if(m){forceOut(m);return}
    iniciaTeste(s.data(),u.uid);
    lic.ver=Date.now();lic.nome=s.data().nome||lic.nome;lic.exp=s.data().expiraEm||null;setLic(lic);hideLg();watch(u.uid);checkV();
   }).catch(()=>{});
  });
 }catch(e){}
}
async function lgEntrar(){
 const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;
 if(!u||!p){lgMsg('Informe usuário e senha.');return}
 if(!window.firebase||!auth){lgMsg('Sem conexão com o servidor. Conecte à internet para entrar.');return}
 const em=u.includes('@')?u:u+'@'+LIC.dominio,b=$('#lb');
 b.disabled=true;b.textContent='Entrando…';lgMsg('');
 try{
  const cr=await auth.signInWithEmailAndPassword(em,p),id=cr.user.uid,ref=fdb.collection('licencas').doc(id);
  const sn=await ref.get();
  if(!sn.exists){await auth.signOut();throw{m:'Licença não encontrada. Fale com o suporte.'}}
  const d=sn.data();
  if(!d.ativo){await auth.signOut();throw{m:'Licença inativa. Fale com o suporte.'}}
  if(expirou(d.expiraEm)){await auth.signOut();throw{m:MSG_TESTE}}
  const agora=Date.now(),troca=!!d.sessao&&d.aparelho!==TERM;
  let ts=(d.trocasTs||[]).filter(t=>agora-t<864e5);
  if(troca)ts.push(agora);
  if(ts.length>=LIC.maxTrocas24h){
   await ref.update({suspeito:true,trocasTs:ts}).catch(()=>{});
   await auth.signOut();throw{m:'Muitas trocas de aparelho em 24h. Fale com o suporte.'}}
  const sid=uid()+uid();
  const ini=d.teste&&!d.expiraEm&&d.testeMs?agora+d.testeMs:null;
  await ref.update({...(ini?{expiraEm:ini}:{}),sessao:sid,aparelho:TERM,aparelhoInfo:((navigator.userAgent.match(/\(([^)]+)\)/)||[])[1]||'').slice(0,80),ultimoLogin:agora,trocas:(d.trocas||0)+(troca?1:0),trocasTs:ts.slice(-10)});
  lic={uid:id,nome:d.nome||u,sessao:sid,ver:agora,exp:ini||d.expiraEm||null};setLic(lic);
  $('#lp').value='';watch(id);hideLg();checkV();
 }catch(e){lgMsg(msgErro(e))}
 finally{b.disabled=false;b.textContent='Entrar'}
}
const TESTE_MS=216e5;
function lgTesteAbre(){const o=$('#lt2').style.display=='grid';$('#lt2').style.display=o?'none':'grid';$('#lt').textContent=o?'🎁 Testar grátis por 6 horas':'← Já tenho conta';lgMsg('')}
async function lgTesteCria(){
 const nome=$('#tn').value.trim().slice(0,60),w=$('#tw').value.replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,''),s=$('#ts').value;
 if(nome.length<2){lgMsg('Informe seu nome.');return}
 if(w.length<10||w.length>11){lgMsg('Informe o WhatsApp com DDD.');return}
 if(s.length<6){lgMsg('A senha precisa ter 6 ou mais caracteres.');return}
 if(!window.firebase||!auth||!fdb){lgMsg('Sem conexão com o servidor. Conecte à internet para criar o teste.');return}
 const b=$('#tb'),em=w+'@'+LIC.dominio;b.disabled=true;b.textContent='Criando…';lgMsg('');
 try{
  let cr;
  try{cr=await auth.createUserWithEmailAndPassword(em,s)}
  catch(e){if(/email-already-in-use/.test((e&&e.code)||''))throw{m:'Este WhatsApp já tem cadastro. Toque em "Já tenho conta" para entrar ou fale com o suporte.'};throw e}
  const agora=Date.now(),id=cr.user.uid,bt=fdb.batch();
  bt.set(fdb.collection('licencas').doc(id),{nome,usuario:w,email:em,whatsapp:w,ativo:true,criadoEm:agora,sessao:null,aparelho:null,aparelhoInfo:'',ultimoLogin:null,trocas:0,trocasTs:[],suspeito:false,teste:true,testeMs:TESTE_MS,expiraEm:agora+TESTE_MS,autoTeste:true});
  bt.set(fdb.collection('testes').doc(TERM),{uid:id,t:agora});
  try{await bt.commit()}
  catch(e){try{await cr.user.delete()}catch(x){}try{await auth.signOut()}catch(x){}
   throw/permission/.test((e&&e.code)||'')?{m:'Não foi possível liberar o teste: este aparelho já usou o teste, a data/hora do aparelho está errada ou o teste está fechado. Fale com o suporte.'}:e}
  $('#lu').value=w;$('#lp').value=s;$('#ts').value='';$('#lt2').style.display='none';$('#lt').textContent='🎁 Testar grátis por 6 horas';
  await lgEntrar();
 }catch(e){lgMsg(msgErro(e))}
 finally{b.disabled=false;b.textContent='Criar meu teste de 6 horas'}}
function sair(){cl();forceOut('')}
setInterval(()=>{if(lic&&lic.exp&&expirou(lic.exp))forceOut(MSG_TESTE);else if(lic&&lic.exp&&view=='menu')render()},60000);
licInit();
load();
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script><script>setTimeout(function(){var e=document.getElementById('splash');if(e){e.classList.add('out');setTimeout(function(){e.remove()},600)}},3500)</script></body></html>
